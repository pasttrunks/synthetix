[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "synthetix-ai-detector"
version = "0.3.0"
description = "Experimental AI text detection tool (local-first, not validated for production use)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn==0.29.0",
    "pydantic==2.7.1",
    "torch==2.3.0",
    "transformers==4.40.2",
    "requests==2.31.0",
    "numpy==1.26.4",
]

[project.optional-dependencies]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "httpx==0.27.0",
]
benchmark = [
    "scikit-learn==1.4.2",
    "matplotlib==3.8.4",
]

[project.scripts]
synthetix-serve = "server:main"

[tool.setuptools]
py-modules = ["server"]

[tool.setuptools.packages.find]
where = ["."]
include = ["synthetix*", "benchmark*"]
namespaces = true



[tool.pytest.ini_options]
testpaths = ["tests"]

