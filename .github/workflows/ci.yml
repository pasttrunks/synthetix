name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]"

      - name: Run scoped unit test suite
        run: |
          python -m pytest tests/

      - name: Build wheel package distribution
        run: |
          python -m pip install build
          python -m build --wheel --outdir dist/

      - name: Test clean wheel installation in isolated environment
        run: |
          python -m venv wheel_test_env
          ./wheel_test_env/bin/pip install dist/*.whl || ./wheel_test_env/Scripts/pip install dist/*.whl
          ./wheel_test_env/bin/python -c "import synthetix.signals.lexical_regularity_heuristic; import synthetix.signals.span_detector; import benchmark.adapters.external_adapters; print('Clean wheel package imports succeeded!')" || ./wheel_test_env/Scripts/python -c "import synthetix.signals.lexical_regularity_heuristic; import synthetix.signals.span_detector; import benchmark.adapters.external_adapters; print('Clean wheel package imports succeeded!')"


      - name: Validate benchmark corpus schema
        run: |
          python benchmark/evaluate.py --corpus benchmark/corpus/essay_corpus.jsonl --dry-run
          python benchmark/evaluate.py --corpus benchmark/corpus/test.jsonl --dry-run

      - name: Run real-time detector evaluation and release gate check
        run: |
          python server.py &
          SERVER_PID=$!
          python scripts/wait_for_readiness.py
          python benchmark/evaluate.py --corpus benchmark/corpus/test.jsonl --api-url http://127.0.0.1:8000/api/analyze --output-dir benchmark/ci-reports
          python benchmark/gate.py --report benchmark/ci-reports/report_latest.json --expected-commit-sha $GITHUB_SHA
          kill $SERVER_PID || true

      - name: Upload evaluation report and predictions
        uses: actions/upload-artifact@v4
        with:
          name: ci-evaluation-artifacts
          path: |
            benchmark/ci-reports/report_latest.json
            benchmark/ci-reports/predictions.jsonl
          if-no-files-found: error
          retention-days: 30
