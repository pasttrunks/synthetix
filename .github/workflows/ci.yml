name: Continuous Integration

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test:
    name: Run Unit Tests & Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,benchmark]"

      - name: Run scoped unit test suite
        run: |
          python -m pytest tests/

      - name: Validate benchmark corpus schema
        run: |
          python benchmark/evaluate.py --corpus benchmark/corpus/essay_corpus.jsonl --dry-run

      - name: Run quality gate check
        run: |
          python benchmark/gate.py --report benchmark/reports/report_latest.json
